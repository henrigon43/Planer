<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Caderno Outline with 4 spiral rings -->
  <path
    d="M 148 105
       L 148 158
       L 122 158
       A 15 15 0 0 0 122 188
       L 148 188
       L 148 218
       L 122 218
       A 15 15 0 0 0 122 248
       L 148 248
       L 148 278
       L 122 278
       A 15 15 0 0 0 122 308
       L 148 308
       L 148 338
       L 122 338
       A 15 15 0 0 0 122 368
       L 148 368
       L 148 405
       L 318 405
       L 318 105
       Z"
    stroke="#000000"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#ffffff"
  />

  <!-- 5 horizontal lines on notebook page -->
  <line x1="178" y1="152" x2="288" y2="152" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <line x1="178" y1="204" x2="288" y2="204" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <line x1="178" y1="255" x2="288" y2="255" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <line x1="178" y1="306" x2="288" y2="306" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <line x1="178" y1="358" x2="288" y2="358" stroke="#000000" stroke-width="16" stroke-linecap="round" />

  <!-- Pencil / Caneta to the right -->
  <!-- Top Eraser Dome -->
  <path
    d="M 364 140
       A 18 18 0 0 1 400 140
       Z"
    stroke="#000000"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#ffffff"
  />

  <!-- Ferrule Divider / Band (Solid Black) -->
  <rect x="364" y="146" width="36" height="22" rx="2" fill="#000000" />

  <!-- Pencil Body -->
  <rect
    x="364"
    y="168"
    width="36"
    height="176"
    stroke="#000000"
    stroke-width="16"
    stroke-linejoin="round"
    fill="#ffffff"
  />

  <!-- Pencil Tip Cone -->
  <polygon
    points="364,344 382,402 400,344"
    stroke="#000000"
    stroke-width="16"
    stroke-linejoin="round"
    fill="#ffffff"
  />

  <!-- Graphite Tip (Filled Black) -->
  <polygon
    points="375,380 382,402 389,380"
    fill="#000000"
  />
</svg>
